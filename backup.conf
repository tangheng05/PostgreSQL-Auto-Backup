# =============================================================================
# PostgreSQL Auto Backup - Configuration
# =============================================================================

# --- Database Settings ---
DB_NAME="serey_prod"           # Database name to backup
DB_USER="postgres"             # PostgreSQL user
DB_HOST="localhost"            # Database host
DB_PORT="5432"                 # Database port

# --- Backup Storage ---
BACKUP_DIR="/var/backups/pg_backups"  # Where backups are stored
BACKUP_PREFIX="serey_prod"     # Filename prefix for backup files

# --- Schedule (used by setup_cron.sh as default) ---
# Runs every day at 02:00 AM — low traffic, safe window
DEFAULT_CRON_SCHEDULE="0 2 * * *"

# --- Retention Policy ---
MAX_BACKUPS=7                  # Keep last 7 backups (1 week). Oldest deleted automatically.
# Set to 0 to disable retention (keep all backups — use with caution)

# --- Compression ---
# Formats: custom (Fc - best compression + fastest restore), plain (sql text), tar (Ft)
DUMP_FORMAT="custom"           # Recommended: custom (required for pg_restore)
DUMP_EXT="dump"                # File extension — must match format above

# --- Backup Verification ---
# After each backup, runs pg_restore --list to confirm the file is valid (not corrupted).
# Highly recommended — catches silent dump failures before you need to restore.
VERIFY_BACKUP=true

# --- Notifications (optional) ---
# Leave empty to disable. Alerts fire on both SUCCESS and FAILURE.
SLACK_WEBHOOK_URL=""           # e.g. https://hooks.slack.com/services/xxx/yyy/zzz
DISCORD_WEBHOOK_URL=""         # e.g. https://discord.com/api/webhooks/xxx/yyy
NOTIFY_EMAIL=""                # e.g. admin@example.com (requires mailutils: apt install mailutils)

# --- Logging ---
LOG_FILE="/var/log/pg_backup.log"  # Set to "" to log to stdout only
LOG_RETENTION_DAYS=30              # Days of log history to keep (0 = keep forever)

# --- Advanced ---
LOCK_FILE="/tmp/pg_backup.lock"    # Prevents two backup runs overlapping
PG_DUMP_EXTRA_OPTS=""              # Extra pg_dump flags e.g. "--exclude-table=session_logs"
